version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lablens-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://lablens_user:lablens_pass@db:5432/lablens_db
      - STORAGE_DIR=/app/uploads
      - SECRET_KEY=lablens_production_secret_key_change_me
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lablens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: lablens-db
    environment:
      - POSTGRES_USER=lablens_user
      - POSTGRES_PASSWORD=lablens_pass
      - POSTGRES_DB=lablens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data:
